# Статика фронта на GitHub Pages. API — только Yandex Cloud Function (yc-api/),
# задаётся секретом VITE_API_BASE_URL (invoke-URL без слэша в конце).
# Vercel-варианта больше нет: VITE_API_BASE_URL обязателен.
#
# Подготовка (один раз):
# 1. GitHub → Settings → Pages → Build and deployment → Source: GitHub Actions.
# 2. Settings → Secrets and variables → Actions → добавить все VITE_* секреты
#    (значения те же, что в Vercel env) + VITE_API_BASE_URL (см. ниже).
# 3. Push в main → вкладка Actions → деплой → сайт на https://<user>.github.io/<repo>/.
#
# VITE_API_BASE_URL (обязателен): invoke-URL Yandex-функции без слэша в конце,
# например https://functions.yandexcloud.net/<id>.
# Этот же origin должен быть в env функции FRONTEND_ORIGINS.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
